blueprint:
  name: Stream Dock N3 (headless-streamdock) button & knob actions
  description: >-
    Single automation that maps every button press, knob turn and knob press
    published by headless-streamdock over MQTT to Home Assistant actions,
    instead of creating one automation per button. This is the variant for the
    Mirabox N3 (and compatible devices such as the Ajazz AKP03); use
    streamdock_n1_actions.yaml for the VSD Inside N1. Find the trigger topic in
    the device's MQTT discovery config (Settings -> Devices & Services -> MQTT
    -> your Stream Dock device), or just use `streamdock/<serial>/trigger`.
    Buttons are numbered 0-8 and knobs 0-2, matching the physical device;
    leave any you don't use empty. Double and triple presses are only reported
    by buttons and knobs whose multi-click switch is turned on (under
    Configuration on the device page).
  domain: automation
  input:
    streamdock_topic:
      name: Trigger topic
      description: The MQTT trigger topic, e.g. streamdock/4250D278343F/trigger
      selector:
        text: {}
    buttons:
      name: Buttons
      icon: mdi:gesture-tap-button
      collapsed: false
      input:
        button_0_action:
          name: Button 0
          default: []
          selector:
            action: {}
        button_1_action:
          name: Button 1
          default: []
          selector:
            action: {}
        button_2_action:
          name: Button 2
          default: []
          selector:
            action: {}
        button_3_action:
          name: Button 3
          default: []
          selector:
            action: {}
        button_4_action:
          name: Button 4
          default: []
          selector:
            action: {}
        button_5_action:
          name: Button 5
          default: []
          selector:
            action: {}
        button_6_action:
          name: Button 6
          default: []
          selector:
            action: {}
        button_7_action:
          name: Button 7
          default: []
          selector:
            action: {}
        button_8_action:
          name: Button 8
          default: []
          selector:
            action: {}
    buttons_double:
      name: Double presses
      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        button_0_double_action:
          name: Button 0 double pressed
          default: []
          selector:
            action: {}
        button_1_double_action:
          name: Button 1 double pressed
          default: []
          selector:
            action: {}
        button_2_double_action:
          name: Button 2 double pressed
          default: []
          selector:
            action: {}
        button_3_double_action:
          name: Button 3 double pressed
          default: []
          selector:
            action: {}
        button_4_double_action:
          name: Button 4 double pressed
          default: []
          selector:
            action: {}
        button_5_double_action:
          name: Button 5 double pressed
          default: []
          selector:
            action: {}
        button_6_double_action:
          name: Button 6 double pressed
          default: []
          selector:
            action: {}
        button_7_double_action:
          name: Button 7 double pressed
          default: []
          selector:
            action: {}
        button_8_double_action:
          name: Button 8 double pressed
          default: []
          selector:
            action: {}
    buttons_triple:
      name: Triple presses
      icon: mdi:numeric-3-circle-outline
      collapsed: true
      input:
        button_0_triple_action:
          name: Button 0 triple pressed
          default: []
          selector:
            action: {}
        button_1_triple_action:
          name: Button 1 triple pressed
          default: []
          selector:
            action: {}
        button_2_triple_action:
          name: Button 2 triple pressed
          default: []
          selector:
            action: {}
        button_3_triple_action:
          name: Button 3 triple pressed
          default: []
          selector:
            action: {}
        button_4_triple_action:
          name: Button 4 triple pressed
          default: []
          selector:
            action: {}
        button_5_triple_action:
          name: Button 5 triple pressed
          default: []
          selector:
            action: {}
        button_6_triple_action:
          name: Button 6 triple pressed
          default: []
          selector:
            action: {}
        button_7_triple_action:
          name: Button 7 triple pressed
          default: []
          selector:
            action: {}
        button_8_triple_action:
          name: Button 8 triple pressed
          default: []
          selector:
            action: {}
    knobs:
      name: Knobs
      icon: mdi:knob
      collapsed: true
      input:
        knob_0_left_action:
          name: Knob 0 rotated left
          default: []
          selector:
            action: {}
        knob_0_right_action:
          name: Knob 0 rotated right
          default: []
          selector:
            action: {}
        knob_0_press_action:
          name: Knob 0 pressed
          default: []
          selector:
            action: {}
        knob_0_double_action:
          name: Knob 0 double pressed
          default: []
          selector:
            action: {}
        knob_0_triple_action:
          name: Knob 0 triple pressed
          default: []
          selector:
            action: {}
        knob_1_left_action:
          name: Knob 1 rotated left
          default: []
          selector:
            action: {}
        knob_1_right_action:
          name: Knob 1 rotated right
          default: []
          selector:
            action: {}
        knob_1_press_action:
          name: Knob 1 pressed
          default: []
          selector:
            action: {}
        knob_1_double_action:
          name: Knob 1 double pressed
          default: []
          selector:
            action: {}
        knob_1_triple_action:
          name: Knob 1 triple pressed
          default: []
          selector:
            action: {}
        knob_2_left_action:
          name: Knob 2 rotated left
          default: []
          selector:
            action: {}
        knob_2_right_action:
          name: Knob 2 rotated right
          default: []
          selector:
            action: {}
        knob_2_press_action:
          name: Knob 2 pressed
          default: []
          selector:
            action: {}
        knob_2_double_action:
          name: Knob 2 double pressed
          default: []
          selector:
            action: {}
        knob_2_triple_action:
          name: Knob 2 triple pressed
          default: []
          selector:
            action: {}

triggers:
  - trigger: mqtt
    topic: !input streamdock_topic

conditions: []

actions:
  - choose:
      - conditions: "{{ trigger.payload == 'button_0_press' }}"
        sequence: !input button_0_action
      - conditions: "{{ trigger.payload == 'button_1_press' }}"
        sequence: !input button_1_action
      - conditions: "{{ trigger.payload == 'button_2_press' }}"
        sequence: !input button_2_action
      - conditions: "{{ trigger.payload == 'button_3_press' }}"
        sequence: !input button_3_action
      - conditions: "{{ trigger.payload == 'button_4_press' }}"
        sequence: !input button_4_action
      - conditions: "{{ trigger.payload == 'button_5_press' }}"
        sequence: !input button_5_action
      - conditions: "{{ trigger.payload == 'button_6_press' }}"
        sequence: !input button_6_action
      - conditions: "{{ trigger.payload == 'button_7_press' }}"
        sequence: !input button_7_action
      - conditions: "{{ trigger.payload == 'button_8_press' }}"
        sequence: !input button_8_action
      - conditions: "{{ trigger.payload == 'button_0_press_2' }}"
        sequence: !input button_0_double_action
      - conditions: "{{ trigger.payload == 'button_1_press_2' }}"
        sequence: !input button_1_double_action
      - conditions: "{{ trigger.payload == 'button_2_press_2' }}"
        sequence: !input button_2_double_action
      - conditions: "{{ trigger.payload == 'button_3_press_2' }}"
        sequence: !input button_3_double_action
      - conditions: "{{ trigger.payload == 'button_4_press_2' }}"
        sequence: !input button_4_double_action
      - conditions: "{{ trigger.payload == 'button_5_press_2' }}"
        sequence: !input button_5_double_action
      - conditions: "{{ trigger.payload == 'button_6_press_2' }}"
        sequence: !input button_6_double_action
      - conditions: "{{ trigger.payload == 'button_7_press_2' }}"
        sequence: !input button_7_double_action
      - conditions: "{{ trigger.payload == 'button_8_press_2' }}"
        sequence: !input button_8_double_action
      - conditions: "{{ trigger.payload == 'button_0_press_3' }}"
        sequence: !input button_0_triple_action
      - conditions: "{{ trigger.payload == 'button_1_press_3' }}"
        sequence: !input button_1_triple_action
      - conditions: "{{ trigger.payload == 'button_2_press_3' }}"
        sequence: !input button_2_triple_action
      - conditions: "{{ trigger.payload == 'button_3_press_3' }}"
        sequence: !input button_3_triple_action
      - conditions: "{{ trigger.payload == 'button_4_press_3' }}"
        sequence: !input button_4_triple_action
      - conditions: "{{ trigger.payload == 'button_5_press_3' }}"
        sequence: !input button_5_triple_action
      - conditions: "{{ trigger.payload == 'button_6_press_3' }}"
        sequence: !input button_6_triple_action
      - conditions: "{{ trigger.payload == 'button_7_press_3' }}"
        sequence: !input button_7_triple_action
      - conditions: "{{ trigger.payload == 'button_8_press_3' }}"
        sequence: !input button_8_triple_action
      - conditions: "{{ trigger.payload == 'knob_0_left' }}"
        sequence: !input knob_0_left_action
      - conditions: "{{ trigger.payload == 'knob_0_right' }}"
        sequence: !input knob_0_right_action
      - conditions: "{{ trigger.payload == 'knob_0_press' }}"
        sequence: !input knob_0_press_action
      - conditions: "{{ trigger.payload == 'knob_0_press_2' }}"
        sequence: !input knob_0_double_action
      - conditions: "{{ trigger.payload == 'knob_0_press_3' }}"
        sequence: !input knob_0_triple_action
      - conditions: "{{ trigger.payload == 'knob_1_left' }}"
        sequence: !input knob_1_left_action
      - conditions: "{{ trigger.payload == 'knob_1_right' }}"
        sequence: !input knob_1_right_action
      - conditions: "{{ trigger.payload == 'knob_1_press' }}"
        sequence: !input knob_1_press_action
      - conditions: "{{ trigger.payload == 'knob_1_press_2' }}"
        sequence: !input knob_1_double_action
      - conditions: "{{ trigger.payload == 'knob_1_press_3' }}"
        sequence: !input knob_1_triple_action
      - conditions: "{{ trigger.payload == 'knob_2_left' }}"
        sequence: !input knob_2_left_action
      - conditions: "{{ trigger.payload == 'knob_2_right' }}"
        sequence: !input knob_2_right_action
      - conditions: "{{ trigger.payload == 'knob_2_press' }}"
        sequence: !input knob_2_press_action
      - conditions: "{{ trigger.payload == 'knob_2_press_2' }}"
        sequence: !input knob_2_double_action
      - conditions: "{{ trigger.payload == 'knob_2_press_3' }}"
        sequence: !input knob_2_triple_action

mode: parallel
max: 5
