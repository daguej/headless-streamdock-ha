blueprint:
  name: Stream Dock N1 (headless-streamdock) button & knob actions
  description: >-
    Single automation that maps every button press, knob turn and knob press
    published by headless-streamdock over MQTT to Home Assistant actions,
    instead of creating one automation per button. This is the variant for the
    VSD Inside N1 (and compatible devices such as the Mirabox N1); use
    streamdock_actions.yaml for the Mirabox N3. Find the trigger topic in the
    device's MQTT discovery config (Settings -> Devices & Services -> MQTT ->
    your Stream Dock device), or just use `streamdock/<serial>/trigger`.
    Buttons 0-14 are the key screens, numbered left to right and top to bottom,
    and buttons 15-16 are the two buttons above the LCD strip. Leave any you
    don't use empty.
  domain: automation
  input:
    streamdock_topic:
      name: Trigger topic
      description: The MQTT trigger topic, e.g. streamdock/4250D278343F/trigger
      selector:
        text: {}
    buttons:
      name: Buttons
      icon: mdi:gesture-tap-button
      collapsed: false
      input:
        button_0_action:
          name: Button 0
          default: []
          selector:
            action: {}
        button_1_action:
          name: Button 1
          default: []
          selector:
            action: {}
        button_2_action:
          name: Button 2
          default: []
          selector:
            action: {}
        button_3_action:
          name: Button 3
          default: []
          selector:
            action: {}
        button_4_action:
          name: Button 4
          default: []
          selector:
            action: {}
        button_5_action:
          name: Button 5
          default: []
          selector:
            action: {}
        button_6_action:
          name: Button 6
          default: []
          selector:
            action: {}
        button_7_action:
          name: Button 7
          default: []
          selector:
            action: {}
        button_8_action:
          name: Button 8
          default: []
          selector:
            action: {}
        button_9_action:
          name: Button 9
          default: []
          selector:
            action: {}
        button_10_action:
          name: Button 10
          default: []
          selector:
            action: {}
        button_11_action:
          name: Button 11
          default: []
          selector:
            action: {}
        button_12_action:
          name: Button 12
          default: []
          selector:
            action: {}
        button_13_action:
          name: Button 13
          default: []
          selector:
            action: {}
        button_14_action:
          name: Button 14
          default: []
          selector:
            action: {}
        button_15_action:
          name: Top button left
          default: []
          selector:
            action: {}
        button_16_action:
          name: Top button right
          default: []
          selector:
            action: {}
    knobs:
      name: Knobs
      icon: mdi:knob
      collapsed: true
      input:
        knob_0_left_action:
          name: Knob 0 rotated left
          default: []
          selector:
            action: {}
        knob_0_right_action:
          name: Knob 0 rotated right
          default: []
          selector:
            action: {}
        knob_0_press_action:
          name: Knob 0 pressed
          default: []
          selector:
            action: {}

triggers:
  - trigger: mqtt
    topic: !input streamdock_topic

conditions: []

actions:
  - choose:
      - conditions: "{{ trigger.payload == 'button_0_press' }}"
        sequence: !input button_0_action
      - conditions: "{{ trigger.payload == 'button_1_press' }}"
        sequence: !input button_1_action
      - conditions: "{{ trigger.payload == 'button_2_press' }}"
        sequence: !input button_2_action
      - conditions: "{{ trigger.payload == 'button_3_press' }}"
        sequence: !input button_3_action
      - conditions: "{{ trigger.payload == 'button_4_press' }}"
        sequence: !input button_4_action
      - conditions: "{{ trigger.payload == 'button_5_press' }}"
        sequence: !input button_5_action
      - conditions: "{{ trigger.payload == 'button_6_press' }}"
        sequence: !input button_6_action
      - conditions: "{{ trigger.payload == 'button_7_press' }}"
        sequence: !input button_7_action
      - conditions: "{{ trigger.payload == 'button_8_press' }}"
        sequence: !input button_8_action
      - conditions: "{{ trigger.payload == 'button_9_press' }}"
        sequence: !input button_9_action
      - conditions: "{{ trigger.payload == 'button_10_press' }}"
        sequence: !input button_10_action
      - conditions: "{{ trigger.payload == 'button_11_press' }}"
        sequence: !input button_11_action
      - conditions: "{{ trigger.payload == 'button_12_press' }}"
        sequence: !input button_12_action
      - conditions: "{{ trigger.payload == 'button_13_press' }}"
        sequence: !input button_13_action
      - conditions: "{{ trigger.payload == 'button_14_press' }}"
        sequence: !input button_14_action
      - conditions: "{{ trigger.payload == 'button_15_press' }}"
        sequence: !input button_15_action
      - conditions: "{{ trigger.payload == 'button_16_press' }}"
        sequence: !input button_16_action
      - conditions: "{{ trigger.payload == 'knob_0_left' }}"
        sequence: !input knob_0_left_action
      - conditions: "{{ trigger.payload == 'knob_0_right' }}"
        sequence: !input knob_0_right_action
      - conditions: "{{ trigger.payload == 'knob_0_press' }}"
        sequence: !input knob_0_press_action

mode: single
